<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>local-pdf-compress</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3dd6c6;
      --danger: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a3a36 0%, transparent 50%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { width: min(560px, 100%); }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 6px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .drop {
      border: 1.5px dashed var(--line);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      background: var(--card);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop.over, .drop:hover { border-color: var(--accent); background: #1c2a2c; }
    .drop strong { display: block; margin-top: 8px; }
    .drop span { color: var(--muted); font-size: .9rem; }
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
    }
    .presets label {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      background: var(--card);
      font-size: .85rem;
    }
    .presets input { display: none; }
    .presets label:has(input:checked) {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      color: var(--accent);
    }
    .presets small { display: block; color: var(--muted); font-size: .72rem; margin-top: 4px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: var(--accent);
      color: #06201c;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      display: none;
    }
    .status.show { display: block; }
    .status.error { border-color: var(--danger); color: var(--danger); }
    a.dl {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-weight: 600;
    }
    .health { font-size: .8rem; color: var(--muted); margin-top: 18px; }
    .health.bad { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>local-pdf-compress</h1>
    <p class="sub">Your file stays on this computer. Nothing is uploaded.</p>

    <div class="drop" id="drop">
      <span>Drop a PDF here, or click to pick one</span>
      <strong id="fname">No file yet</strong>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" hidden />

    <div class="presets">
      <label>
        <input type="radio" name="q" value="high" />
        High
        <small>Email or screen</small>
      </label>
      <label>
        <input type="radio" name="q" value="medium" checked />
        Balanced
        <small>Good for most files</small>
      </label>
      <label>
        <input type="radio" name="q" value="low" />
        Print
        <small>Better quality</small>
      </label>
    </div>

    <button id="go" disabled>Compress</button>
    <div class="status" id="status"></div>
    <p class="health" id="health"></p>
  </div>
  <script>
    const drop = document.getElementById("drop");
    const input = document.getElementById("file");
    const fname = document.getElementById("fname");
    const go = document.getElementById("go");
    const status = document.getElementById("status");
    const health = document.getElementById("health");
    let file = null;

    function fmt(n) {
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      return (n / 1048576).toFixed(1) + " MB";
    }

    function setFile(f) {
      if (!f || !f.name.toLowerCase().endsWith(".pdf")) {
        show("Please pick a PDF file.", true);
        return;
      }
      file = f;
      fname.textContent = f.name + " · " + fmt(f.size);
      go.disabled = false;
      status.className = "status";
    }

    function show(html, err) {
      status.className = "status show" + (err ? " error" : "");
      status.innerHTML = html;
    }

    drop.addEventListener("click", () => input.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      setFile(e.dataTransfer.files[0]);
    });
    input.addEventListener("change", () => setFile(input.files[0]));

    go.addEventListener("click", async () => {
      if (!file) return;
      const q = document.querySelector("input[name=q]:checked").value;
      go.disabled = true;
      show("Working...");
      try {
        const url = "/compress?quality=" + encodeURIComponent(q)
          + "&filename=" + encodeURIComponent(file.name);
        const res = await fetch(url, { method: "POST", body: file });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not compress the file");
        const note = data.note ? "<br>" + data.note : "";
        show(
          fmt(data.before) + " -> <strong>" + fmt(data.after) + "</strong>"
          + " · " + data.saved_percent + "% smaller" + note
          + '<br><a class="dl" href="/download/' + data.job + '">Download ' + data.filename + "</a>"
        );
      } catch (e) {
        show(e.message, true);
      }
      go.disabled = false;
    });

    fetch("/health").then(r => r.json()).then(d => {
      health.textContent = d.message;
      health.className = "health" + (d.ok ? "" : " bad");
    }).catch(() => {
      health.textContent = "The app is not running";
      health.className = "health bad";
    });
  </script>
</body>
</html>
